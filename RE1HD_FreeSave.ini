[Main]
Enable=1
; 1 = creates the RE1HD_FreeSave.log file (diagnostics). 0 = no log and no file is created. (default: 0)
Log=0
; 1 = allows saving at the typewriter without an ink ribbon. 0 = original behavior. (default: 1)
FreeSave=1
; 1 = if you HAVE an ink ribbon, it is still consumed when saving (as in the original game).
; 0 = ink ribbons are never consumed (saving is always free). (default: 1)
ConsumeRibbon=1
; 1 = when you PICK UP an ink ribbon in the environment, a green herb is added to your inventory instead (quantity preserved). The model in the environment
; remains that of an ink ribbon. (default: 1)
RibbonToHerb=1
; IDs found in your log: ink ribbon = 68, green herb = 34. To give a different item instead of the ribbon, change HerbItemId.
RibbonItemId=68
HerbItemId=34
; 1 = logs inventory slot assignment calls to RE1HD_FreeSave.log (to help identify the ribbon -> green herb replacement). Keep at 0 during normal use.
LogItems=0